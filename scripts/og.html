<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with `npm run og`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62.5% 125%; src: url("../public/fonts/archivo-latin-wdth-normal.woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url("../public/fonts/geist-mono-latin-wght-normal.woff2"); }
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../public/fonts/geist-latin-wght-normal.woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    padding: 56px 64px; background: #06070a; color: #f3f5f9; font-family: "Geist", sans-serif;
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(255 255 255 / .07) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / .07) 1px, transparent 1px); background-size: 96px 96px; mask-image: radial-gradient(70% 80% at 80% 30%, #000, transparent 75%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(45% 50% at 82% 24%, rgb(111 168 255 / .22), transparent 70%), radial-gradient(40% 45% at 10% 95%, rgb(198 255 74 / .14), transparent 70%); }
  svg.net { position: absolute; right: 40px; top: 40px; width: 560px; height: 420px; }
  .net line { stroke: rgb(140 160 200 / .35); stroke-width: 1.2; }
  .net circle { fill: #c6ff4a; }
  .net circle.b { fill: #6fa8ff; }
  .top, .bottom, h1 { position: relative; }
  .top { display: flex; align-items: center; gap: 14px; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #aab1bf; }
  .top .pip { width: 10px; height: 10px; border-radius: 50%; background: #c6ff4a; box-shadow: 0 0 0 6px rgb(198 255 74 / .25); }
  .top .url { margin-left: auto; color: #626a78; text-transform: none; letter-spacing: .02em; }
  h1 { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: 150px; line-height: .86; letter-spacing: -.035em; margin-left: -6px; }
  h1 span { display: block; }
  h1 span:last-child { background: linear-gradient(100deg, #f3f5f9 30%, #aab1bf 70%, #626a78); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 22px; border-top: 1px solid rgb(255 255 255 / .16); }
  .bottom .role { font-size: 24px; line-height: 1.3; color: #aab1bf; }
  .bottom .tag { font-family: "Archivo", sans-serif; font-weight: 600; font-stretch: 110%; font-size: 32px; letter-spacing: -.02em; }
  .bottom .tag em { font-style: normal; color: #c6ff4a; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <svg class="net" viewBox="0 0 560 420" aria-hidden="true">
    <g>
      <line x1="60" y1="80" x2="190" y2="40"/><line x1="190" y1="40" x2="320" y2="90"/><line x1="320" y1="90" x2="450" y2="50"/><line x1="450" y1="50" x2="520" y2="150"/>
      <line x1="60" y1="80" x2="120" y2="200"/><line x1="120" y1="200" x2="260" y2="170"/><line x1="260" y1="170" x2="320" y2="90"/><line x1="260" y1="170" x2="400" y2="210"/><line x1="400" y1="210" x2="520" y2="150"/>
      <line x1="120" y1="200" x2="90" y2="330"/><line x1="260" y1="170" x2="230" y2="300"/><line x1="230" y1="300" x2="90" y2="330"/><line x1="230" y1="300" x2="380" y2="340"/><line x1="380" y1="340" x2="400" y2="210"/><line x1="380" y1="340" x2="500" y2="290"/><line x1="500" y1="290" x2="520" y2="150"/>
    </g>
    <circle cx="60" cy="80" r="4"/><circle cx="190" cy="40" r="3" class="b"/><circle cx="320" cy="90" r="5"/><circle cx="450" cy="50" r="3" class="b"/><circle cx="520" cy="150" r="4"/>
    <circle cx="120" cy="200" r="4" class="b"/><circle cx="260" cy="170" r="6"/><circle cx="400" cy="210" r="4"/><circle cx="90" cy="330" r="3" class="b"/><circle cx="230" cy="300" r="5"/><circle cx="380" cy="340" r="4" class="b"/><circle cx="500" cy="290" r="3"/>
  </svg>
  <div class="top"><span class="pip"></span> Identity verified · Modern Workplace Architect <span class="url">mcdowell.dev</span></div>
  <h1><span>Ryan</span><span>McDowell</span></h1>
  <div class="bottom">
    <p class="role">Microsoft 365 Specialist<br>Founder, Netix Digital</p>
    <p class="tag">Possibility through <em>technology.</em></p>
  </div>
</body>
</html>
