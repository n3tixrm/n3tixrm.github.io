<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with `npm run og`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("../public/fonts/inter-tight-latin-wght-normal.woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url("../public/fonts/geist-mono-latin-wght-normal.woff2"); }
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../public/fonts/geist-latin-wght-normal.woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center;
    padding: 64px 72px; background: #0b1817; color: #f3f7f5; font-family: "Geist", sans-serif;
  }
  .left { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 20px "Inter Tight", sans-serif; letter-spacing: -0.01em; }
  .brand svg { width: 36px; height: 36px; }
  h1 { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 84px; line-height: 0.96; letter-spacing: -0.045em; }
  h1 em { font-style: normal; color: #6de7d0; }
  .sub { margin-top: 28px; font-size: 24px; line-height: 1.4; color: #a9bdb7; max-width: 540px; }
  .tag { font-family: "Inter Tight", sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.01em; color: #a9bdb7; }
  .tag em { font-style: normal; color: #6de7d0; }
  .bars { display: grid; gap: 14px; }
  .bar { display: flex; justify-content: space-between; align-items: flex-end; height: 86px; padding: 18px 24px; border-radius: 22px; font-weight: 600; font-size: 20px; }
  .bar span:last-child { font-family: "Geist Mono", monospace; font-weight: 600; font-size: 18px; }
  .b1 { background: #47a3e0; color: #081c30; width: 100%; }
  .b2 { background: #6de7d0; color: #0b2a24; width: 92%; }
  .b3 { background: #af7ac6; color: #260f30; width: 84%; }
  .b4 { background: #e6666c; color: #330f10; width: 76%; }
  .b5 { background: #f1cb29; color: #2c2204; width: 68%; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#6de7d0"/><rect x="3.5" y="3.5" width="25" height="19" rx="2.8" fill="#0b2a24"/><path fill="#0b2a24" d="M1.5 24.5h29v1.3a2.4 2.4 0 0 1-2.4 2.4H3.9a2.4 2.4 0 0 1-2.4-2.4z"/><g transform="translate(8 5.2) scale(0.5)"><path fill="#6de7d0" d="M8.5 4.5h5.6a1 1 0 0 1 1 1v21c0 .5-.5.9-.9.7C9.2 25 5.5 20.9 5.5 15.7V7.5a3 3 0 0 1 3-3zM23.5 4.5h-5.6a1 1 0 0 0-1 1v21c0 .5.5.9.9.7 5-2.2 8.7-6.3 8.7-11.5V7.5a3 3 0 0 0-3-3z"/><path fill="#0b2a24" d="M10.6 9.9a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7.3 20c0-2.6 1.5-4.2 3.3-4.2s3.3 1.6 3.3 4.2zM21.4 9.9a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM18.1 20c0-2.6 1.5-4.2 3.3-4.2s3.3 1.6 3.3 4.2z"/></g></svg>
      mcdowell.dev
    </div>
    <div>
      <h1>Ryan<br>McDowell</h1>
      <p class="sub">Modern Workplace Architect<br>Microsoft 365 Specialist · Founder, Netix Digital</p>
    </div>
    <p class="tag">Possibility through <em>technology.</em></p>
  </div>
  <div class="bars">
    <div class="bar b1"><span>Endpoint &amp; devices</span><span>pwsh</span></div>
    <div class="bar b2"><span>Microsoft 365 core</span><span>kql</span></div>
    <div class="bar b3"><span>Identity &amp; security</span><span>graph</span></div>
    <div class="bar b4"><span>Observability</span><span>metrics</span></div>
    <div class="bar b5"><span>Automation</span><span>gam</span></div>
  </div>
</body>
</html>
