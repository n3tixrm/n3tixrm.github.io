<!doctype html>

  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Ryan McDowell, home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M10 23V9h6a4 4 0 0 1 0 8h-6m6 0 5 6"/></svg>
        <span class="brand-name">Ryan McDowell</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

        </button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap notfound">
    <p class="label"><span>404</span> Not found</p>
    <h1 class="display">This query returned <em>0 rows.</em></h1>
    <figure class="console">
      <div class="console-bar">
        <span class="console-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="console-body">
        <pre class="console-query"><code><span class="t">Pages</span>
<span class="p">|</span> <span class="k">where</span> Path <span class="p">==</span> <span class="s">"<span data-edge="path">this page</span>"</span></code></pre>
        <div class="console-result"><p class="empty-result">No results found. The page may have moved or never existed.</p></div>
      </div>
    </figure>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to the homepage</a>
      <a class="btn btn-ghost" href="/#contact">Get in touch</a>
    </div>
  </main>
</body>
</html>
